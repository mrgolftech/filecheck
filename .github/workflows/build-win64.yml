name: Build Win64

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v0.1-everything-backup
    paths:
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-win64.yml"

jobs:
  build-win64:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Verify x64 runtime
        shell: pwsh
        run: |
          python -c "import platform,struct; print(platform.platform()); print(platform.machine()); print(struct.calcsize('P')*8); assert struct.calcsize('P')*8 == 64"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build FileCheck.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-win64"
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null
          Copy-Item "dist\FileCheck.exe" "$pkg\FileCheck.exe"
          Copy-Item "config\rules.json" "$pkg\config\rules.json"
          Copy-Item "packaging\README-WIN64.txt" "$pkg\README-WIN64.txt"
          @"
          ES CLI is intentionally not bundled.
          Put ES CLI 1.1.0.37+ here as:
              tools\es.exe

          Everything 1.4.x must be installed/running on the target Windows machine.
          "@ | Set-Content -Encoding UTF8 "$pkg\tools\README.txt"

          $hash = (Get-FileHash "$pkg\FileCheck.exe" -Algorithm SHA256).Hash
          "FileCheck.exe  $hash" | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath "package\FileCheck-win64.zip" -Force

          Get-Item "$pkg\FileCheck.exe" | Format-List Name,Length,LastWriteTime
          Get-Content "$pkg\SHA256SUMS.txt"

      - name: Upload Win64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCheck-win64
          path: package/FileCheck-win64.zip
          if-no-files-found: error
          retention-days: 30
