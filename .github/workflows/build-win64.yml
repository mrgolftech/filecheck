name: Build Win64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/v0.1.1-cli-workflow
    paths:
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-win64.yml"

jobs:
  build-win64:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      ES_URL: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x64.zip
      ES_ZIP_SHA256: 7A57670D9152068D05876C58858C82FE6D3915A9DF2C819F4DE8801E2929D3A7
      EVERYTHING_URL: https://www.voidtools.com/Everything-1.4.1.1032.x64.zip
      EVERYTHING_ZIP_SHA256: 698DF475EC44E638F66F1B6A32D28FEA613CEC78D3B6310E6ABE53431EEB940C

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Verify x64 runtime
        shell: pwsh
        run: |
          python -c "import platform,struct; print(platform.platform()); print(platform.machine()); print(struct.calcsize('P')*8); assert struct.calcsize('P')*8 == 64"

      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          filecheck selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FileCheck.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify official ES and Everything
        shell: pwsh
        run: |
          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory=$true)][string]$Uri,
              [Parameter(Mandatory=$true)][string]$OutFile,
              [int]$Attempts = 4
            )
            for ($i = 1; $i -le $Attempts; $i++) {
              try {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                Write-Host "Download attempt $i/$Attempts : $Uri"
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -TimeoutSec 120
                if (-not (Test-Path -LiteralPath $OutFile)) {
                  throw "Download completed without output file: $OutFile"
                }
                return
              }
              catch {
                if ($i -eq $Attempts) { throw }
                $delay = 5 * $i
                Write-Warning "Download failed: $($_.Exception.Message). Retry in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
          }

          Invoke-DownloadWithRetry -Uri "$env:ES_URL" -OutFile "ES-1.1.0.37.x64.zip"
          $esActual = (Get-FileHash "ES-1.1.0.37.x64.zip" -Algorithm SHA256).Hash
          if ($esActual -ne $env:ES_ZIP_SHA256) {
            throw "ES archive SHA-256 mismatch. expected=$env:ES_ZIP_SHA256 actual=$esActual"
          }
          Expand-Archive "ES-1.1.0.37.x64.zip" -DestinationPath "es-dist" -Force
          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          if (-not $es) { throw "es.exe not found in official ES archive" }
          & $es.FullName -version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Invoke-DownloadWithRetry -Uri "$env:EVERYTHING_URL" -OutFile "Everything-1.4.1.1032.x64.zip"
          $everythingActual = (Get-FileHash "Everything-1.4.1.1032.x64.zip" -Algorithm SHA256).Hash
          if ($everythingActual -ne $env:EVERYTHING_ZIP_SHA256) {
            throw "Everything archive SHA-256 mismatch. expected=$env:EVERYTHING_ZIP_SHA256 actual=$everythingActual"
          }
          Expand-Archive "Everything-1.4.1.1032.x64.zip" -DestinationPath "everything-dist" -Force
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          if (-not $everything) { throw "Everything.exe not found in official portable archive" }
          Get-Item $everything.FullName | Format-List Name,Length,LastWriteTime

      - name: Assemble portable package
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-win10plus-x64"
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null

          Copy-Item "dist\FileCheck.exe" "$pkg\FileCheck.exe"
          Copy-Item "config\rules.json" "$pkg\config\rules.json"
          Copy-Item "packaging\README-WIN64.txt" "$pkg\README-WIN64.txt"
          Copy-Item "packaging\THIRD-PARTY-NOTICES.txt" "$pkg\THIRD-PARTY-NOTICES.txt"

          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          Copy-Item $es.FullName "$pkg\tools\es.exe"
          Copy-Item $everything.FullName "$pkg\tools\Everything.exe"

          @"
          Bundled components:
            Everything 1.4.1.1032 x64 portable
            tools\Everything.exe

            Everything Command-line Interface (ES) 1.1.0.37 x64
            tools\es.exe

          FileCheck starts a dedicated Everything instance named FileCheck and stores
          its Everything.ini / Everything.db under runtime\everything. A separately
          installed/default Everything instance is not required for v0.1.1.
          "@ | Set-Content -Encoding UTF8 "$pkg\tools\README.txt"

          $filecheckHash = (Get-FileHash "$pkg\FileCheck.exe" -Algorithm SHA256).Hash
          $everythingHash = (Get-FileHash "$pkg\tools\Everything.exe" -Algorithm SHA256).Hash
          $esHash = (Get-FileHash "$pkg\tools\es.exe" -Algorithm SHA256).Hash
          @(
            "FileCheck.exe  $filecheckHash",
            "tools\Everything.exe  $everythingHash",
            "tools\es.exe  $esHash"
          ) | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"

          Compress-Archive -Path "$pkg\*" -DestinationPath "package\FileCheck-v0.1.1-win10plus-x64.zip" -Force

          Get-Item "$pkg\FileCheck.exe" | Format-List Name,Length,LastWriteTime
          Get-Item "$pkg\tools\Everything.exe" | Format-List Name,Length,LastWriteTime
          Get-Item "$pkg\tools\es.exe" | Format-List Name,Length,LastWriteTime
          Get-Content "$pkg\SHA256SUMS.txt"

      - name: Validate packaged portable discovery
        shell: pwsh
        run: |
          Push-Location "$env:TEMP"
          try {
            & "$env:GITHUB_WORKSPACE\package\FileCheck-win10plus-x64\tools\es.exe" -version | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:GITHUB_WORKSPACE\package\FileCheck-win10plus-x64\FileCheck.exe" doctor | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload Win64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCheck-v0.1.1-win10plus-x64
          path: package/FileCheck-v0.1.1-win10plus-x64.zip
          if-no-files-found: error
          retention-days: 30
