name: Release v0.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/release-v0.1.0.yml"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RELEASE_TAG: v0.1.0
      RELEASE_ASSET: package\FileCheck-v0.1.0-win64.zip
      ES_URL: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x64.zip
      ES_ZIP_SHA256: 7A57670D9152068D05876C58858C82FE6D3915A9DF2C819F4DE8801E2929D3A7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $env:RELEASE_TAG already exists; nothing to publish."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Setup Python x64
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install test and build dependencies
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run release regression tests
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          filecheck selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FileCheck.exe
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py

      - name: Smoke test built executable
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify official ES 1.1.0.37 x64
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:ES_URL" -OutFile "ES-1.1.0.37.x64.zip"
          $actual = (Get-FileHash "ES-1.1.0.37.x64.zip" -Algorithm SHA256).Hash
          if ($actual -ne $env:ES_ZIP_SHA256) {
            throw "ES archive SHA-256 mismatch. expected=$env:ES_ZIP_SHA256 actual=$actual"
          }
          Expand-Archive "ES-1.1.0.37.x64.zip" -DestinationPath "es-dist" -Force
          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          if (-not $es) { throw "es.exe not found in official ES archive" }
          & $es.FullName -version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble release package
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-win64"
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null

          Copy-Item "dist\FileCheck.exe" "$pkg\FileCheck.exe"
          Copy-Item "config\rules.json" "$pkg\config\rules.json"
          Copy-Item "packaging\README-WIN64.txt" "$pkg\README-WIN64.txt"
          Copy-Item "packaging\THIRD-PARTY-NOTICES.txt" "$pkg\THIRD-PARTY-NOTICES.txt"

          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          Copy-Item $es.FullName "$pkg\tools\es.exe"

          @"
          Bundled component:
            Everything Command-line Interface (ES) 1.1.0.37 x64
            tools\es.exe

          Everything 1.4.x itself must still be installed/running on the target Windows machine.
          ES license/source information is in ..\THIRD-PARTY-NOTICES.txt.
          "@ | Set-Content -Encoding UTF8 "$pkg\tools\README.txt"

          $filecheckHash = (Get-FileHash "$pkg\FileCheck.exe" -Algorithm SHA256).Hash
          $esHash = (Get-FileHash "$pkg\tools\es.exe" -Algorithm SHA256).Hash
          @(
            "FileCheck.exe  $filecheckHash",
            "tools\es.exe  $esHash"
          ) | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"

          Compress-Archive -Path "$pkg\*" -DestinationPath "$env:RELEASE_ASSET" -Force

          $assetHash = (Get-FileHash "$env:RELEASE_ASSET" -Algorithm SHA256).Hash
          "release_asset_sha256=$assetHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release asset SHA-256: $assetHash"
          Get-Content "$pkg\SHA256SUMS.txt"

      - name: Validate release package contents
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "filecheck-release-check"
          Expand-Archive "$env:RELEASE_ASSET" -DestinationPath $verifyDir -Force
          $exe = Join-Path $verifyDir "FileCheck.exe"
          $es = Join-Path $verifyDir "tools\es.exe"
          $manifest = Join-Path $verifyDir "config\rules.json"
          if (-not (Test-Path $exe)) { throw "FileCheck.exe missing from release package" }
          if (-not (Test-Path $es)) { throw "tools\es.exe missing from release package" }
          if (-not (Test-Path $manifest)) { throw "config\rules.json missing from release package" }
          & $es -version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release v0.1.0
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "$env:RELEASE_ASSET#FileCheck v0.1.0 Win64" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "FileCheck v0.1.0" `
            --notes-file "packaging\RELEASE_NOTES_V0.1.0.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Published $env:RELEASE_TAG"
          Write-Host "Release asset SHA-256: $env:release_asset_sha256"
