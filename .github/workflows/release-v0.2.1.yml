name: Release v0.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - fix/win7-long-temp-path
      - main
    paths:
      - "README.md"
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-gui-win7-x64.yml"
      - ".github/workflows/build-win7-x64.yml"
      - ".github/workflows/build-win7-x86.yml"
      - ".github/workflows/release-v0.2.1.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether v0.2.1 already exists
        id: check
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; build and publish steps will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch verified package builds
        if: steps.check.outputs.exists != 'true'
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail

          dispatch_and_capture() {
            local workflow="$1"
            local key="$2"
            echo "Dispatching $workflow at ref $GITHUB_REF_NAME / $GITHUB_SHA"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

            local run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$GITHUB_REF_NAME" \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
                | head -n 1)"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Unable to locate dispatched run for $workflow at $GITHUB_SHA" >&2
              exit 1
            fi

            echo "$key=$run_id" >> "$GITHUB_OUTPUT"
            echo "$workflow run id: $run_id"
          }

          dispatch_and_capture "build-gui-win7-x64.yml" "gui_run"
          dispatch_and_capture "build-win7-x64.yml" "cli_x64_run"
          dispatch_and_capture "build-win7-x86.yml" "cli_x86_run"

      - name: Wait for package builds
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for run_id in \
            "${{ steps.dispatch.outputs.gui_run }}" \
            "${{ steps.dispatch.outputs.cli_x64_run }}" \
            "${{ steps.dispatch.outputs.cli_x86_run }}"; do
            echo "Waiting for run $run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          done

      - name: Download package artifacts
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/raw-gui release-assets/raw-cli-x64 release-assets/raw-cli-x86
          gh run download "${{ steps.dispatch.outputs.gui_run }}" --repo "$GITHUB_REPOSITORY" --dir release-assets/raw-gui
          gh run download "${{ steps.dispatch.outputs.cli_x64_run }}" --repo "$GITHUB_REPOSITORY" --dir release-assets/raw-cli-x64
          gh run download "${{ steps.dispatch.outputs.cli_x86_run }}" --repo "$GITHUB_REPOSITORY" --dir release-assets/raw-cli-x86

          gui_zip="$(find release-assets/raw-gui -type f -name '*.zip' | head -n 1)"
          cli_x64_zip="$(find release-assets/raw-cli-x64 -type f -name '*.zip' | head -n 1)"
          cli_x86_zip="$(find release-assets/raw-cli-x86 -type f -name '*.zip' | head -n 1)"

          test -n "$gui_zip" && test -f "$gui_zip"
          test -n "$cli_x64_zip" && test -f "$cli_x64_zip"
          test -n "$cli_x86_zip" && test -f "$cli_x86_zip"

          cp "$gui_zip" release-assets/FileCheck-v0.2.1-gui-x64.zip
          cp "$cli_x64_zip" release-assets/FileCheck-v0.2.1-cli-x64.zip
          cp "$cli_x86_zip" release-assets/FileCheck-v0.2.1-cli-x86.zip

          ls -lh release-assets/FileCheck-v0.2.1-*.zip

      - name: Validate final release ZIP contents
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          required = {
              "FileCheck-v0.2.1-gui-x64.zip": {
                  "FileCheck-GUI.exe",
                  "app/FileCheck-GUI-runtime.exe",
                  "advanced/FileCheck.exe",
                  "tools/es.exe",
                  "tools/Everything.exe",
                  "config/rules.json",
                  "README.md",
                  "SHA256SUMS.txt",
              },
              "FileCheck-v0.2.1-cli-x64.zip": {
                  "FileCheck.exe",
                  "tools/es.exe",
                  "tools/Everything.exe",
                  "config/rules.json",
                  "README.md",
                  "SHA256SUMS.txt",
              },
              "FileCheck-v0.2.1-cli-x86.zip": {
                  "FileCheck.exe",
                  "tools/es.exe",
                  "tools/Everything.exe",
                  "config/rules.json",
                  "README.md",
                  "SHA256SUMS.txt",
              },
          }

          base = Path("release-assets")
          for name, expected in required.items():
              path = base / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"release asset missing or empty: {path}")
              with ZipFile(path) as zf:
                  members = {member.replace("\\", "/") for member in zf.namelist()}
              missing = sorted(expected - members)
              if missing:
                  raise SystemExit(f"{name} missing: {missing}")
              print(f"validated {name}: {path.stat().st_size} bytes")
          PY

      - name: Create release package checksums
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            FileCheck-v0.2.1-gui-x64.zip \
            FileCheck-v0.2.1-cli-x64.zip \
            FileCheck-v0.2.1-cli-x86.zip \
            | sort > SHA256SUMS-v0.2.1.txt
          cat SHA256SUMS-v0.2.1.txt

      - name: Upload dry-run release artifacts
        if: steps.check.outputs.exists != 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: FileCheck-v0.2.1-release-candidate
          path: |
            release-assets/FileCheck-v0.2.1-gui-x64.zip
            release-assets/FileCheck-v0.2.1-cli-x64.zip
            release-assets/FileCheck-v0.2.1-cli-x86.zip
            release-assets/SHA256SUMS-v0.2.1.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v0.2.1
        if: steps.check.outputs.exists != 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/FileCheck-v0.2.1-gui-x64.zip#"GUI x64 - Windows 7 SP1 / 10 / 11" \
            release-assets/FileCheck-v0.2.1-cli-x64.zip#"CLI x64 - Windows 7 SP1 / 10 / 11" \
            release-assets/FileCheck-v0.2.1-cli-x86.zip#"CLI x86 - Windows 7 SP1 32-bit" \
            release-assets/SHA256SUMS-v0.2.1.txt#"Package SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FileCheck v0.2.1" \
            --notes-file packaging/RELEASE_NOTES_V0.2.1.md \
            --latest

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
