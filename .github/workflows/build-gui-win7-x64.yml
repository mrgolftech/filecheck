name: Build GUI Win7 x64

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gui-customtkinter
    paths:
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-gui-win7-x64.yml"

jobs:
  build-gui-win7-x64:
    runs-on: windows-latest

    env:
      PYTHONPATH: src
      ES_URL: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x64.zip
      ES_ZIP_SHA256: 7A57670D9152068D05876C58858C82FE6D3915A9DF2C819F4DE8801E2929D3A7
      EVERYTHING_URL: https://www.voidtools.com/Everything-1.4.1.1032.x64.zip
      EVERYTHING_ZIP_SHA256: 698DF475EC44E638F66F1B6A32D28FEA613CEC78D3B6310E6ABE53431EEB940C

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x64"

      - name: Verify Python runtime
        shell: pwsh
        run: |
          python -c "import platform,sys; print(sys.version); print(platform.architecture()); assert sys.version_info[:2] == (3, 8); assert platform.architecture()[0] == '64bit'"

      - name: Install Win7-compatible GUI build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<76" "wheel<0.46"
          python -m pip install `
            "colorama==0.4.6" `
            "pytest==7.4.4" `
            "pyinstaller==5.13.2" `
            "customtkinter==5.2.2" `
            "darkdetect==0.8.0" `
            "packaging==24.2"

      - name: Compile all source with Python 3.8
        shell: pwsh
        run: |
          python -m compileall -q src packaging/filecheck_entry.py packaging/filecheck_gui_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/filecheck_entry.py selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build advanced CLI executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI onedir bundle
        shell: pwsh
        run: |
          $ctkPath = python -c "import pathlib,customtkinter; print(pathlib.Path(customtkinter.__file__).resolve().parent)"
          Write-Host "CustomTkinter package: $ctkPath"
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name FileCheck-GUI `
            --paths src `
            --hidden-import darkdetect `
            --add-data "config/rules.json;config" `
            --add-data "$ctkPath;customtkinter" `
            packaging/filecheck_gui_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test raw executables
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck-GUI\FileCheck-GUI.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify official ES and Everything
        shell: pwsh
        run: |
          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory=$true)][string]$Uri,
              [Parameter(Mandatory=$true)][string]$OutFile,
              [int]$Attempts = 4
            )
            for ($i = 1; $i -le $Attempts; $i++) {
              try {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                Write-Host "Download attempt $i/$Attempts : $Uri"
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -TimeoutSec 120
                if (-not (Test-Path -LiteralPath $OutFile)) {
                  throw "Download completed without output file: $OutFile"
                }
                return
              }
              catch {
                if ($i -eq $Attempts) { throw }
                $delay = 5 * $i
                Write-Warning "Download failed: $($_.Exception.Message). Retry in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
          }

          Invoke-DownloadWithRetry -Uri "$env:ES_URL" -OutFile "ES-1.1.0.37.x64.zip"
          $esActual = (Get-FileHash "ES-1.1.0.37.x64.zip" -Algorithm SHA256).Hash
          if ($esActual -ne $env:ES_ZIP_SHA256) {
            throw "ES archive SHA-256 mismatch. expected=$env:ES_ZIP_SHA256 actual=$esActual"
          }
          Expand-Archive "ES-1.1.0.37.x64.zip" -DestinationPath "es-dist" -Force
          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          if (-not $es) { throw "es.exe not found in official ES archive" }

          Invoke-DownloadWithRetry -Uri "$env:EVERYTHING_URL" -OutFile "Everything-1.4.1.1032.x64.zip"
          $everythingActual = (Get-FileHash "Everything-1.4.1.1032.x64.zip" -Algorithm SHA256).Hash
          if ($everythingActual -ne $env:EVERYTHING_ZIP_SHA256) {
            throw "Everything archive SHA-256 mismatch. expected=$env:EVERYTHING_ZIP_SHA256 actual=$everythingActual"
          }
          Expand-Archive "Everything-1.4.1.1032.x64.zip" -DestinationPath "everything-dist" -Force
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          if (-not $everything) { throw "Everything.exe not found in official portable archive" }

      - name: Assemble portable GUI package
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-GUI-win7-x64"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\advanced" | Out-Null

          # Keep PyInstaller's DLL/PYD runtime inside one obvious application
          # subdirectory instead of spreading it across the ZIP root.
          Copy-Item "dist\FileCheck-GUI" "$pkg\FileCheck-GUI" -Recurse -Force
          Copy-Item "dist\FileCheck.exe" "$pkg\advanced\FileCheck.exe" -Force
          Copy-Item "config\rules.json" "$pkg\config\rules.json" -Force
          Copy-Item "packaging\README-GUI-WIN7-X64.txt" "$pkg\README.txt" -Force
          Copy-Item "packaging\THIRD-PARTY-NOTICES.txt" "$pkg\THIRD-PARTY-NOTICES.txt" -Force

          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          Copy-Item $es.FullName "$pkg\tools\es.exe" -Force
          Copy-Item $everything.FullName "$pkg\tools\Everything.exe" -Force

          $guiHash = (Get-FileHash "$pkg\FileCheck-GUI\FileCheck-GUI.exe" -Algorithm SHA256).Hash
          $cliHash = (Get-FileHash "$pkg\advanced\FileCheck.exe" -Algorithm SHA256).Hash
          $everythingHash = (Get-FileHash "$pkg\tools\Everything.exe" -Algorithm SHA256).Hash
          $esHash = (Get-FileHash "$pkg\tools\es.exe" -Algorithm SHA256).Hash
          @(
            "FileCheck-GUI\FileCheck-GUI.exe  $guiHash",
            "advanced\FileCheck.exe  $cliHash",
            "tools\Everything.exe  $everythingHash",
            "tools\es.exe  $esHash"
          ) | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"

          Compress-Archive -Path "$pkg\*" -DestinationPath "FileCheck-v0.1.1-gui-win7-x64.zip" -Force
          $assetHash = (Get-FileHash "FileCheck-v0.1.1-gui-win7-x64.zip" -Algorithm SHA256).Hash
          Write-Host "GUI package SHA-256: $assetHash"

      - name: Validate assembled package
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "filecheck-gui-win7-check"
          Expand-Archive "FileCheck-v0.1.1-gui-win7-x64.zip" -DestinationPath $verifyDir -Force
          foreach ($relative in @(
            "FileCheck-GUI\FileCheck-GUI.exe",
            "advanced\FileCheck.exe",
            "tools\es.exe",
            "tools\Everything.exe",
            "config\rules.json",
            "README.txt",
            "SHA256SUMS.txt"
          )) {
            if (-not (Test-Path (Join-Path $verifyDir $relative))) {
              throw "Package file missing: $relative"
            }
          }

          Push-Location $env:TEMP
          try {
            & (Join-Path $verifyDir "advanced\FileCheck.exe") selftest | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $verifyDir "FileCheck-GUI\FileCheck-GUI.exe") --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload portable GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCheck-v0.1.1-gui-win7-x64
          path: FileCheck-v0.1.1-gui-win7-x64.zip
          if-no-files-found: error
          retention-days: 30
