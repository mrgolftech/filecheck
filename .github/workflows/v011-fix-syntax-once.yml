name: Fix v0.1.1 path literals once

on:
  push:
    branches:
      - feat/v0.1.1-cli-workflow
    paths:
      - .github/workflows/v011-fix-syntax-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix trailing-backslash Python literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/filecheck/cli.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False
          for i, line in enumerate(lines):
              if 'p.add_argument("--drive"' in line:
                  lines[i] = '    p.add_argument("--drive", action="append", required=True, help="要索引的盘符/目录；可重复，例如 --drive C: --drive D:")'
                  changed = True
          if not changed:
              raise SystemExit('cli --drive line not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          path = Path('src/filecheck/menu.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False
          for i, line in enumerate(lines):
              if '请输入索引范围，多个用逗号分隔' in line:
                  lines[i] = '        raw = _ask("请输入索引范围，多个用逗号分隔，例如 C:,D:")'
                  changed = True
          if not changed:
              raise SystemExit('menu manual-root prompt not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/filecheck/cli.py src/filecheck/menu.py
          git diff --cached --check
          git commit -m "fix: avoid trailing-backslash examples in Python literals"
          git push origin HEAD:feat/v0.1.1-cli-workflow
