name: Build Win7 x64

on:
  workflow_dispatch:
  push:
    branches:
      - chore/vendor-everything
      - release/win7-x64-work
      - feat/v0.1.1-cli-workflow
      - feat/gui-customtkinter
      - main
    paths:
      - "README.md"
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "vendor/everything/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-win7-x64.yml"

jobs:
  build-win7-x64:
    runs-on: windows-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x64"

      - name: Verify Python runtime
        shell: pwsh
        run: |
          python -c "import platform,sys; print(sys.version); print(platform.architecture()); assert sys.version_info[:2] == (3, 8); assert platform.architecture()[0] == '64bit'"

      - name: Install Win7-compatible test/build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<76" "wheel<0.46"
          python -m pip install `
            "colorama==0.4.6" `
            "pytest==7.4.4" `
            "pyinstaller==5.13.2" `
            "customtkinter==5.2.2" `
            "darkdetect==0.8.0" `
            "packaging==24.2"

      - name: Compile all source with Python 3.8
        shell: pwsh
        run: |
          python -m compileall -q src packaging/filecheck_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python 3.8 regression tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/filecheck_entry.py selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Win7-compatible FileCheck.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py

      - name: Smoke test executable on runner
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify vendored official ES and Everything
        shell: pwsh
        run: |
          & .\packaging\verify_vendored_tools.ps1 -Arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble Win7 x64 portable package
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-win7-x64"
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null

          Copy-Item "dist\FileCheck.exe" "$pkg\FileCheck.exe"
          Copy-Item "README.md" "$pkg\README.md"
          Copy-Item "config\rules.json" "$pkg\config\rules.json"
          Copy-Item "packaging\THIRD-PARTY-NOTICES.txt" "$pkg\THIRD-PARTY-NOTICES.txt"

          Copy-Item "vendor\everything\x64\es.exe" "$pkg\tools\es.exe"
          Copy-Item "vendor\everything\x64\Everything.exe" "$pkg\tools\Everything.exe"

          @"
          Bundled components:
            Everything 1.4.1.1032 x64 portable
            tools\Everything.exe

            Everything Command-line Interface (ES) 1.1.0.37 x64
            tools\es.exe

          FileCheck starts a dedicated Everything instance named FileCheck and stores
          its Everything.ini / Everything-FileCheck.db under runtime\everything.
          "@ | Set-Content -Encoding UTF8 "$pkg\tools\README.txt"

          $filecheckHash = (Get-FileHash "$pkg\FileCheck.exe" -Algorithm SHA256).Hash
          $everythingHash = (Get-FileHash "$pkg\tools\Everything.exe" -Algorithm SHA256).Hash
          $esHash = (Get-FileHash "$pkg\tools\es.exe" -Algorithm SHA256).Hash
          @(
            "FileCheck.exe  $filecheckHash",
            "tools\Everything.exe  $everythingHash",
            "tools\es.exe  $esHash"
          ) | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"

          Compress-Archive -Path "$pkg\*" -DestinationPath "FileCheck-v0.1.1-win7-x64.zip" -Force
          $assetHash = (Get-FileHash "FileCheck-v0.1.1-win7-x64.zip" -Algorithm SHA256).Hash
          Write-Host "Win7 package SHA-256: $assetHash"
          Get-Content "$pkg\SHA256SUMS.txt"

      - name: Validate package contents and discovery
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "filecheck-win7-check"
          Expand-Archive "FileCheck-v0.1.1-win7-x64.zip" -DestinationPath $verifyDir -Force
          if (-not (Test-Path (Join-Path $verifyDir "FileCheck.exe"))) { throw "FileCheck.exe missing" }
          if (-not (Test-Path (Join-Path $verifyDir "README.md"))) { throw "README.md missing" }
          if (-not (Test-Path (Join-Path $verifyDir "tools\es.exe"))) { throw "tools\es.exe missing" }
          if (-not (Test-Path (Join-Path $verifyDir "tools\Everything.exe"))) { throw "tools\Everything.exe missing" }
          if (-not (Test-Path (Join-Path $verifyDir "config\rules.json"))) { throw "rules.json missing" }
          Push-Location $env:TEMP
          try {
            & (Join-Path $verifyDir "FileCheck.exe") doctor | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload Win7 x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCheck-v0.1.1-win7-x64
          path: FileCheck-v0.1.1-win7-x64.zip
          if-no-files-found: error
          retention-days: 30
