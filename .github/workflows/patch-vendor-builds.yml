name: Patch builds for vendored Everything

on:
  push:
    branches:
      - chore/vendor-everything
    paths:
      - ".github/workflows/patch-vendor-builds.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/vendor-everything

      - name: Patch build workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          configs = {
              Path('.github/workflows/build-win7-x64.yml'): 'x64',
              Path('.github/workflows/build-win7-x86.yml'): 'x86',
              Path('.github/workflows/build-gui-win7-x64.yml'): 'x64',
          }

          for path, arch in configs.items():
              text = path.read_text(encoding='utf-8')

              if '      - chore/vendor-everything\n' not in text:
                  marker = '    branches:\n'
                  pos = text.index(marker) + len(marker)
                  text = text[:pos] + '      - chore/vendor-everything\n' + text[pos:]

              if '      - "vendor/everything/**"\n' not in text:
                  marker = '      - "packaging/**"\n'
                  text = text.replace(marker, marker + '      - "vendor/everything/**"\n', 1)

              text = re.sub(
                  r'\n      ES_URL: .*?\n      ES_ZIP_SHA256: .*?\n      EVERYTHING_URL: .*?\n      EVERYTHING_ZIP_SHA256: .*?\n',
                  '\n',
                  text,
                  count=1,
                  flags=re.S,
              )

              pattern = re.compile(
                  r'      - name: Download and verify official(?: x86)? ES and Everything\n'
                  r'        shell: pwsh\n'
                  r'        run: \|\n'
                  r'.*?(?=      - name: Assemble)',
                  re.S,
              )
              replacement = (
                  '      - name: Verify vendored official ES and Everything\n'
                  '        shell: pwsh\n'
                  '        run: |\n'
                  f'          & .\\packaging\\verify_vendored_tools.ps1 -Arch {arch}\n'
                  '          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n\n'
              )
              text, count = pattern.subn(lambda _m: replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to replace download step in {path}')

              old = (
                  '          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1\n'
                  '          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1\n'
                  '          Copy-Item $es.FullName "$pkg\\tools\\es.exe"'
              )
              if old not in text:
                  raise SystemExit(f'expected packaging ES block not found in {path}')
              text = text.replace(
                  old,
                  f'          Copy-Item "vendor\\everything\\{arch}\\es.exe" "$pkg\\tools\\es.exe"',
                  1,
              )
              old2 = '          Copy-Item $everything.FullName "$pkg\\tools\\Everything.exe"'
              if old2 not in text:
                  raise SystemExit(f'expected packaging Everything block not found in {path}')
              text = text.replace(
                  old2,
                  f'          Copy-Item "vendor\\everything\\{arch}\\Everything.exe" "$pkg\\tools\\Everything.exe"',
                  1,
              )

              forbidden = ['Invoke-WebRequest', 'ES_URL:', 'EVERYTHING_URL:', 'es-dist', 'everything-dist']
              leftovers = [item for item in forbidden if item in text]
              if leftovers:
                  raise SystemExit(f'network/vendor leftovers in {path}: {leftovers}')

              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Export patched workflow text files
        shell: bash
        run: |
          mkdir -p tmp/patched-workflows
          cp .github/workflows/build-win7-x64.yml tmp/patched-workflows/build-win7-x64.yml.txt
          cp .github/workflows/build-win7-x86.yml tmp/patched-workflows/build-win7-x86.yml.txt
          cp .github/workflows/build-gui-win7-x64.yml tmp/patched-workflows/build-gui-win7-x64.yml.txt
          git restore .github/workflows/build-win7-x64.yml .github/workflows/build-win7-x86.yml .github/workflows/build-gui-win7-x64.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/patched-workflows
          git commit -m "chore(ci): export patched vendored build workflows"
          git push origin HEAD:chore/vendor-everything
