name: Release v0.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/release-v0.1.1.yml"

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check whether v0.1.1 already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v0.1.1 already exists; publish jobs will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: win10plus-x64
            python: "3.12"
            architecture: x64
            legacy: "false"
            readme_src: packaging\README-WIN64.txt
            readme_name: README-WIN64.txt
            es_url: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x64.zip
            es_sha256: 7A57670D9152068D05876C58858C82FE6D3915A9DF2C819F4DE8801E2929D3A7
            everything_url: https://www.voidtools.com/Everything-1.4.1.1032.x64.zip
            everything_sha256: 698DF475EC44E638F66F1B6A32D28FEA613CEC78D3B6310E6ABE53431EEB940C
            tool_arch: x64
          - package: win7-x64
            python: "3.8.10"
            architecture: x64
            legacy: "true"
            readme_src: packaging\README-WIN7-X64.txt
            readme_name: README-WIN7-X64.txt
            es_url: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x64.zip
            es_sha256: 7A57670D9152068D05876C58858C82FE6D3915A9DF2C819F4DE8801E2929D3A7
            everything_url: https://www.voidtools.com/Everything-1.4.1.1032.x64.zip
            everything_sha256: 698DF475EC44E638F66F1B6A32D28FEA613CEC78D3B6310E6ABE53431EEB940C
            tool_arch: x64
          - package: win7-x86
            python: "3.8.10"
            architecture: x86
            legacy: "true"
            readme_src: packaging\README-WIN7-X86.txt
            readme_name: README-WIN7-X86.txt
            es_url: https://github.com/voidtools/ES/releases/download/1.1.0.37/ES-1.1.0.37.x86.zip
            es_sha256: 35F8FE8C92B44D834CF51239EE345927E44D33C6C86D64B756990B066FA0DA47
            everything_url: https://www.voidtools.com/Everything-1.4.1.1032.x86.zip
            everything_sha256: 156DB5BEB747D69470518A7B9B55AF11EFC4D3285DDB7CC013C0CC13CED5F237
            tool_arch: x86

    env:
      PYTHONPATH: src
      PACKAGE_NAME: ${{ matrix.package }}
      LEGACY_BUILD: ${{ matrix.legacy }}
      README_SRC: ${{ matrix.readme_src }}
      README_NAME: ${{ matrix.readme_name }}
      ES_URL: ${{ matrix.es_url }}
      ES_ZIP_SHA256: ${{ matrix.es_sha256 }}
      EVERYTHING_URL: ${{ matrix.everything_url }}
      EVERYTHING_ZIP_SHA256: ${{ matrix.everything_sha256 }}
      TOOL_ARCH: ${{ matrix.tool_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}

      - name: Verify Python runtime
        shell: pwsh
        run: |
          python -c "import platform,struct,sys; print(sys.version); print(platform.architecture()); print(struct.calcsize('P')*8)"
          if ("$env:PACKAGE_NAME" -eq "win7-x86") {
            python -c "import struct; assert struct.calcsize('P')*8 == 32"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            python -c "import struct; assert struct.calcsize('P')*8 == 64"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install test and build dependencies
        shell: pwsh
        run: |
          if ($env:LEGACY_BUILD -eq "true") {
            python -m pip install --upgrade "pip<25" "setuptools<76" "wheel<0.46"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m pip install "colorama==0.4.6" "pytest==7.4.4" "pyinstaller==5.13.2"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m pip install -e ".[dev,build]"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Compile source
        shell: pwsh
        run: |
          python -m compileall -q src packaging/filecheck_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run release regression tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/filecheck_entry.py selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FileCheck.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name FileCheck `
            --paths src `
            --add-data "config/rules.json;config" `
            packaging/filecheck_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Win7 x86 PE architecture
        if: matrix.package == 'win7-x86'
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import struct; data=Path('dist/FileCheck.exe').read_bytes(); pe=struct.unpack_from('<I',data,0x3c)[0]; machine=struct.unpack_from('<H',data,pe+4)[0]; print(f'PE machine=0x{machine:04X}'); assert machine == 0x014C"

      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\FileCheck.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\FileCheck.exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify official Everything and ES
        shell: pwsh
        run: |
          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory=$true)][string]$Uri,
              [Parameter(Mandatory=$true)][string]$OutFile,
              [int]$Attempts = 4
            )
            for ($i = 1; $i -le $Attempts; $i++) {
              try {
                Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
                Write-Host "Download attempt $i/$Attempts : $Uri"
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -TimeoutSec 120
                if (-not (Test-Path -LiteralPath $OutFile)) { throw "Download produced no file" }
                return
              }
              catch {
                if ($i -eq $Attempts) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          Invoke-DownloadWithRetry -Uri "$env:ES_URL" -OutFile "es.zip"
          $esActual = (Get-FileHash "es.zip" -Algorithm SHA256).Hash
          if ($esActual -ne $env:ES_ZIP_SHA256) { throw "ES SHA-256 mismatch: $esActual" }
          Expand-Archive "es.zip" -DestinationPath "es-dist" -Force

          Invoke-DownloadWithRetry -Uri "$env:EVERYTHING_URL" -OutFile "everything.zip"
          $everythingActual = (Get-FileHash "everything.zip" -Algorithm SHA256).Hash
          if ($everythingActual -ne $env:EVERYTHING_ZIP_SHA256) { throw "Everything SHA-256 mismatch: $everythingActual" }
          Expand-Archive "everything.zip" -DestinationPath "everything-dist" -Force

          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          if (-not $es) { throw "es.exe not found" }
          if (-not $everything) { throw "Everything.exe not found" }
          & $es.FullName -version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable release package
        shell: pwsh
        run: |
          $pkg = "package\FileCheck-$env:PACKAGE_NAME"
          $asset = "FileCheck-v0.1.1-$env:PACKAGE_NAME.zip"
          New-Item -ItemType Directory -Force "$pkg\config" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\tools" | Out-Null

          Copy-Item "dist\FileCheck.exe" "$pkg\FileCheck.exe"
          Copy-Item "config\rules.json" "$pkg\config\rules.json"
          Copy-Item "$env:README_SRC" "$pkg\$env:README_NAME"
          Copy-Item "packaging\THIRD-PARTY-NOTICES.txt" "$pkg\THIRD-PARTY-NOTICES.txt"

          $es = Get-ChildItem "es-dist" -Recurse -File -Filter "es.exe" | Select-Object -First 1
          $everything = Get-ChildItem "everything-dist" -Recurse -File -Filter "Everything.exe" | Select-Object -First 1
          Copy-Item $es.FullName "$pkg\tools\es.exe"
          Copy-Item $everything.FullName "$pkg\tools\Everything.exe"

          @"
          Bundled components:
            Everything 1.4.1.1032 $env:TOOL_ARCH portable
            tools\Everything.exe

            Everything Command-line Interface (ES) 1.1.0.37 $env:TOOL_ARCH
            tools\es.exe

          FileCheck starts a dedicated Everything instance named FileCheck.
          Runtime index data is stored under runtime\everything, including
          Everything.ini and Everything-FileCheck.db.
          "@ | Set-Content -Encoding UTF8 "$pkg\tools\README.txt"

          $filecheckHash = (Get-FileHash "$pkg\FileCheck.exe" -Algorithm SHA256).Hash
          $everythingHash = (Get-FileHash "$pkg\tools\Everything.exe" -Algorithm SHA256).Hash
          $esHash = (Get-FileHash "$pkg\tools\es.exe" -Algorithm SHA256).Hash
          @(
            "FileCheck.exe  $filecheckHash",
            "tools\Everything.exe  $everythingHash",
            "tools\es.exe  $esHash"
          ) | Set-Content -Encoding ASCII "$pkg\SHA256SUMS.txt"

          Compress-Archive -Path "$pkg\*" -DestinationPath "$asset" -Force
          $assetHash = (Get-FileHash "$asset" -Algorithm SHA256).Hash
          Write-Host "$asset SHA-256: $assetHash"
          Get-Content "$pkg\SHA256SUMS.txt"

      - name: Validate release package
        shell: pwsh
        run: |
          $asset = "FileCheck-v0.1.1-$env:PACKAGE_NAME.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "filecheck-v011-$env:PACKAGE_NAME"
          Expand-Archive "$asset" -DestinationPath $verifyDir -Force
          foreach ($relative in @("FileCheck.exe", "tools\es.exe", "tools\Everything.exe", "config\rules.json", "SHA256SUMS.txt")) {
            if (-not (Test-Path (Join-Path $verifyDir $relative))) { throw "Missing from release package: $relative" }
          }
          Push-Location $env:TEMP
          try {
            & (Join-Path $verifyDir "FileCheck.exe") doctor | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $verifyDir "FileCheck.exe") selftest | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: FileCheck-v0.1.1-${{ matrix.package }}.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - check-release
      - build
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create package checksum file
        run: |
          cd release-assets
          sha256sum FileCheck-v0.1.1-*.zip | sort > SHA256SUMS-V0.1.1.txt
          cat SHA256SUMS-V0.1.1.txt

      - name: Publish GitHub Release v0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            release-assets/FileCheck-v0.1.1-win10plus-x64.zip#"Windows 10/11 x64" \
            release-assets/FileCheck-v0.1.1-win7-x64.zip#"Windows 7 SP1 x64" \
            release-assets/FileCheck-v0.1.1-win7-x86.zip#"Windows 7 SP1 x86" \
            release-assets/SHA256SUMS-V0.1.1.txt#"Package SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FileCheck v0.1.1" \
            --notes-file packaging/RELEASE_NOTES_V0.1.1.md \
            --latest

          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY"
