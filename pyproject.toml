[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filecheck"
version = "0.2.3"
description = "Portable Windows file self-check, directory backup, verification, safe source removal and restore tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "mrgolftech"}]
dependencies = [
    "colorama>=0.4.6,<1",
    "customtkinter>=5.2.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
filecheck = "filecheck.launcher:main"
filecheck-gui = "filecheck.gui.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
