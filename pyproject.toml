[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filecheck"
version = "0.1.0"
description = "Windows offline file self-check, backup and restore tool accelerated by Everything 1.4"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "mrgolftech"}]
dependencies = []

[project.scripts]
filecheck = "filecheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
